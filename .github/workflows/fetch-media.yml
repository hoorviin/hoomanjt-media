name: fetch-media
on:
  workflow_dispatch:
    inputs:
      folder:
        description: "Folder name for this video, e.g. 2026-10-coaching"
        required: true
      urls:
        description: "Photo or video URLs separated by spaces"
        required: true
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download
        env:
          FOLDER: ${{ inputs.folder }}
          URLS: ${{ inputs.urls }}
        run: |
          mkdir -p "media/$FOLDER"
          i=1
          for u in $URLS; do
            ct=$(curl -sfL -A "Mozilla/5.0 (Macintosh; Intel Mac OS X 10_15_7)" "$u" -o tmp.bin -w '%{content_type}') || { echo "FAILED $u" >> "media/$FOLDER/SOURCES.txt"; i=$((i+1)); continue; }
            case "$ct" in image/jpeg*) ext=jpg;; image/png*) ext=png;; image/webp*) ext=webp;; video/mp4*) ext=mp4;; video/quicktime*) ext=mov;; video/webm*) ext=webm;; *) ext=bin;; esac
            mv tmp.bin "media/$FOLDER/p$i.$ext"
            echo "p$i.$ext $u" >> "media/$FOLDER/SOURCES.txt"
            i=$((i+1))
          done
      - name: Commit
        env:
          FOLDER: ${{ inputs.folder }}
        run: |
          git config user.name "media-bot"; git config user.email "media-bot@users.noreply.github.com"
          git add media && git commit -m "media: $FOLDER" && git push || echo "nothing to commit"
