name: fetch-media
on:
  workflow_dispatch:
    inputs:
      folder:
        description: "Folder name for this video, e.g. 2026-10-coaching"
        required: true
      urls:
        description: "Image URLs separated by spaces"
        required: true
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download
        env:
          FOLDER: ${{ inputs.folder }}
          URLS: ${{ inputs.urls }}
        run: |
          mkdir -p "media/$FOLDER"
          i=1
          for u in $URLS; do
            ext="${u##*.}"; ext="${ext%%\?*}"; case "$ext" in jpg|jpeg|png|webp) ;; *) ext=jpg;; esac
            curl -sfL -A "hoomanjt-media-fetch/1.0" "$u" -o "media/$FOLDER/p$i.$ext" && echo "$u" >> "media/$FOLDER/SOURCES.txt"
            i=$((i+1))
          done
      - name: Commit
        env:
          FOLDER: ${{ inputs.folder }}
        run: |
          git config user.name "media-bot"; git config user.email "media-bot@users.noreply.github.com"
          git add media && git commit -m "media: $FOLDER" && git push || echo "nothing to commit"
